spring.application.name=ServiceHub

# Server Port
server.port=${PORT:8080}

# MongoDB Connection
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/servicehub}

# JWT Authentication
jwt.secret=${JWT_SECRET:ServiceHubSecretKeyForDevelopmentOnly123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Platform Commission
payment.commission.rate=${PLATFORM_COMMISSION_RATE:0.10}

# Payment Gateway (Future integrations)
payment.gateway.api-key=${PAYMENT_GATEWAY_API_KEY:mock-api-key}
payment.gateway.secret-key=${PAYMENT_GATEWAY_SECRET_KEY:mock-secret-key}

# CORS — comma-separated list of allowed origins for the frontend dev server.
# Override this in production (e.g. CORS_ALLOWED_ORIGINS=https://yourdomain.com)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# SpringDoc / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method