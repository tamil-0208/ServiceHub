# ==============================================================================
# Hypermarketplace - Production Configuration Profile (spring.profiles.active=prod)
# ==============================================================================

# Server configuration
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=always

# MongoDB - Must be supplied via environment variable (e.g., MongoDB Atlas URI)
spring.data.mongodb.uri=${MONGODB_URI}

# JWT Security - Mandatory secure secret key & expiration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Platform Commission Rate (Default: 10% = 0.10)
payment.commission.rate=${PLATFORM_COMMISSION_RATE:0.10}

# Future Payment Gateway Integration Keys
payment.gateway.api-key=${PAYMENT_GATEWAY_API_KEY:}
payment.gateway.secret-key=${PAYMENT_GATEWAY_SECRET_KEY:}

# CORS - Production Frontend Domain(s), comma-separated
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging Configuration
logging.level.root=WARN
logging.level.com.Hypermarketplace.backend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO

# SpringDoc / Swagger UI (Configurable for production)
springdoc.api-docs.enabled=${ENABLE_SWAGGER:true}
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
